version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: villa_dieng_postgres
    environment:
      POSTGRES_DB: db_villa_dieng
      POSTGRES_USER: kevinnazar
      POSTGRES_PASSWORD: kevinnazar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: villa_dieng_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: